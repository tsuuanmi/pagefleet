<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PageFleet — AI Content Studio</title><link rel="stylesheet" href="/style.css"></head>
<body>
<div id="login" hidden><form id="loginForm" class="login-panel"><h1>PageFleet</h1><p>Nhập mật khẩu để mở workspace.</p><input id="password" type="password" autocomplete="current-password" required><button>Đăng nhập</button></form></div>
<div id="app" hidden>
  <aside>
    <div class="brand"><span class="logo">P</span><div><strong>PageFleet</strong><small>AI CONTENT STUDIO</small></div></div>
    <div class="eyebrow">WORKSPACE</div>
    <nav>
      <button class="nav active" data-tab="overview">▦ &nbsp; Tổng quan</button>
      <button class="nav" data-tab="ideas">▤ &nbsp; Nội dung</button>
      <button class="nav" data-tab="pages">☷ &nbsp; Fanpages</button>
      <button class="nav" data-tab="calendar">▦ &nbsp; Lịch đăng</button>
    </nav>
    <div class="side-bottom"><span class="status-dot"></span> <span id="publisherLabel">Mock Publisher</span><p>Local-first · MVP</p><button id="logout" class="link-button" hidden>Đăng xuất</button></div>
  </aside>
  <main>
    <header><div><div class="eyebrow" id="breadcrumb">WORKSPACE / TỔNG QUAN</div><h1 id="heading">Tổng quan</h1><p class="subtitle" id="subtitle">Quản lý nội dung cho nhiều Fanpage trong một nơi.</p></div><div class="header-actions"><span class="chip">10 FANPAGES</span><button class="primary" id="newIdea">+ Nội dung mới</button></div></header>
    <div id="notice" role="status" aria-live="polite" hidden></div>
    <section id="overview" class="tab"></section>
    <section id="ideas" class="tab" hidden></section>
    <section id="pages" class="tab" hidden></section>
    <section id="calendar" class="tab" hidden></section>
  </main>
</div>
<dialog id="dialog"><form id="form"><div id="dialogContent"></div><footer><button value="cancel" formnovalidate id="cancel" type="button">Huỷ</button><button class="primary" type="submit" id="submit">Lưu</button></footer></form></dialog>
<script src="/app.js" defer></script>
</body></html>
