name: MVP

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax, domain logic and import tests
        run: npm run check
      - name: Local HTTP smoke test (mock mode only)
        run: |
          set -eu
          DATA_DIR="$(mktemp -d)"
          export DATA_DIR PORT=3088 HOST=127.0.0.1 PUBLISHER=mock
          node src/server.mjs > "$DATA_DIR/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; rm -rf "$DATA_DIR"' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3088/api/session > "$DATA_DIR/session.json"; then break; fi
            sleep 1
          done
          grep -q '"authenticated":true' "$DATA_DIR/session.json"
          curl -fsS http://127.0.0.1:3088/api/state > "$DATA_DIR/state.json"
          grep -q '"pages"' "$DATA_DIR/state.json"
          curl -fsS -H 'Content-Type: application/json' -H 'X-PageFleet-Request: 1' -d '{"title":"Smoke test","brief":"Local test","page_ids":["page-1"]}' http://127.0.0.1:3088/api/idea > "$DATA_DIR/idea.json"
          grep -q '"id"' "$DATA_DIR/idea.json"
      - name: Demo HTTP smoke test (mock-only, LAN CLI, password protection)
        run: |
          set -eu
          DATA_DIR="$(mktemp -d)"
          export DATA_DIR PORT=3099 PUBLISHER=mock APP_PASSWORD=test-passphrase-12345678
          node src/server.mjs --demo --public --port 3099 > "$DATA_DIR/demo.log" 2>&1 &
          demo_pid=$!
          trap 'kill "$demo_pid" 2>/dev/null || true; rm -rf "$DATA_DIR"' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3099/api/session > "$DATA_DIR/session.json"; then break; fi
            sleep 1
          done
          grep -q '"authenticated":false' "$DATA_DIR/session.json"
          code="$(curl -s -o "$DATA_DIR/blocked.json" -w '%{http_code}' http://127.0.0.1:3099/api/state)"
          test "$code" = 401
          curl -fsS -c "$DATA_DIR/cookie" -H 'Content-Type: application/json' -H 'X-PageFleet-Request: 1' -d '{"password":"test-passphrase-12345678"}' http://127.0.0.1:3099/api/login > "$DATA_DIR/login.json"
          curl -fsS -b "$DATA_DIR/cookie" http://127.0.0.1:3099/api/state > "$DATA_DIR/state.json"
          grep -q '"demo":true' "$DATA_DIR/state.json"
          grep -q '"title":"Bao Bì Xanh"' "$DATA_DIR/state.json" || grep -q '"name":"Bao Bì Xanh"' "$DATA_DIR/state.json"
          grep -q '"scheduled"' "$DATA_DIR/state.json"
          code="$(curl -s -o "$DATA_DIR/badhost.json" -w '%{http_code}' -H 'Host: evil.invalid:3099' http://127.0.0.1:3099/api/session)"
          test "$code" = 403
